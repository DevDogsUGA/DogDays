name: CI

# Two required checks, each reported under its own name: `validate` and
# `database` (the main-ci ruleset requires both). The destructive gate is
# database.yaml and destructive-gate.yaml. `contract` is advisory: it runs the
# catalog contract tests (contract/) against the staging catalog. `app` is the
# app's own lint, typecheck, tests and build, with no secrets; the ruleset
# should require it too once DevDogsUGA's PRODUCT_REQUIRED_CHECKS lists it.
#
# `merge_group` is here because the merge queue builds a temporary branch and
# waits for these checks on it: without the trigger a queued pull request waits
# forever.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# A push to main gets a group of its own: a deploy waiting for a production
# approval must not hold back the next commit's checks.
concurrency:
  group: ci-${{ (github.event_name == 'merge_group' || github.event_name == 'push') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything that needs no app install: the workflows, the Markdown, the env manifest.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint the workflows (actionlint)
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Every relative link in the Markdown resolves
        run: node .github/scripts/check-docs.mjs
      # .env.example is copied into every contributor's .env: public values only.
      - name: .env.example holds public values only
        run: node .github/scripts/check-env-example.mjs
      - name: The check scripts test themselves
        run: node --test .github/scripts/*.test.mjs
      - name: The shell scripts parse
        run: for f in .github/scripts/*.sh; do bash -n "$f"; done

  # What a pull request does to the database. Unconditional, deliberately: a
  # security check that skips itself on a path filter is the failure mode that
  # leaves an RLS hole unchecked. With no schema it passes in a few seconds.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The base branch's schema and types are read from git.
          fetch-depth: 0
      - uses: ./.github/actions/setup-supabase
      - uses: ./.github/actions/setup-devtools
      - name: Apply, test and generate
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A first push has no "before": compare with the commit it follows.
          case "$BASE_SHA" in 0000000000000000000000000000000000000000|"") BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD) ;; esac
          BASE_SHA="$BASE_SHA" bash .github/scripts/db-check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('src/supabase/database.types.ts') != ''
        with:
          name: types
          path: src/supabase/database.types.ts
          retention-days: 14

  # The app: lint, typecheck, unit tests and a production build, with no
  # secrets, so a fork's pull request runs it. It needs the generated database
  # types, which the `database` job builds from THIS commit's schema (the
  # `types` artifact), so a pull request that changes a table is typechecked
  # against its own change.
  app:
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Enable the pnpm this repository pins
        run: corepack enable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: types
          path: src/supabase
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # The catalog contract (contract/): the SDK's generated client against a real
  # catalog, pinned to the shapes DogDays reads. Public API, no secrets, so it
  # runs on fork pull requests. It needs the SDK's `next` prerelease; until that
  # is on npm it says so and passes, rather than failing every pull request for
  # something no contributor can fix.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Is @devdogsuga/sdk@next published?
        id: sdk
        run: |
          version=$(npm view '@devdogsuga/sdk@next' version 2>/dev/null || true)
          if [ -z "$version" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::@devdogsuga/sdk has no next release on npm yet, so the catalog contract tests did not run."
            { echo '### Catalog contract'; echo; echo 'Skipped: @devdogsuga/sdk@next is not on npm yet.'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            pinned=$(node -p "require('./contract/package.json').dependencies['@devdogsuga/sdk']")
            echo "SDK_VERSION=$pinned" >> "$GITHUB_ENV"
            # The contract tests run against the PINNED SDK (contract/package-lock.json);
            # a newer next is a Renovate bump, not a surprise in an unrelated build.
            if [ "$pinned" != "$version" ]; then echo "::notice::@devdogsuga/sdk@next is $version; the contract pins $pinned."; fi
          fi
      - name: Install
        if: steps.sdk.outputs.published == 'true'
        working-directory: contract
        run: npm ci --no-audit --no-fund
      - name: The generated types satisfy the pinned shapes
        if: steps.sdk.outputs.published == 'true'
        working-directory: contract
        run: npm run typecheck
      - name: The staging catalog answers with those shapes
        if: steps.sdk.outputs.published == 'true'
        working-directory: contract
        env:
          CATALOG_URL: https://api-staging.devdogsuga.org/catalog/v1
        run: |
          npm test
          { echo '### Catalog contract'; echo; echo "Passed against \`$CATALOG_URL\` with \`@devdogsuga/sdk@$SDK_VERSION\`."; } >> "$GITHUB_STEP_SUMMARY"

  # Every commit that lands on main is staged; production is a latch the Gate
  # opens (deploy.yaml).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, database, app]
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read

name: Deploy

# DogDays' own deploy, built from the two shared blocks in DevDogsUGA
# (deploy-database.yaml, pinned by commit SHA, Q15). Called by ci.yaml on every
# push to main once `validate` and `database` are green, and runnable by hand.
#
#   staging      the database goes through the shared block on every push:
#                hand-written migrations (none are committed), then the
#                declarative diff of supabase/schemas, each hash-checked. A
#                destructive plan is refused unless its pull request carried
#                allow-destructive from a devops member. Then a check that the deployed API serves the
#                schema and refuses the signed-out visitor.
#
#   production   OFF until the repository variable DOGDAYS_DEPLOYS_PRODUCTION is
#                `true`; setting it is part of the Gate, not before. Then, in order:
#
#     production-catalog   waits until the PRODUCTION catalog serves the current
#                          and the next term (wait-for-catalog.mjs). No approval,
#                          no secrets: it reads a public API. On the first deploy
#                          this is what waits for the platform to go live.
#     production-database  the shared block: a read-only plan (`preflight`), an
#                          approval of `production` (devops, the author and the
#                          person who queued it excluded), then the schema, the
#                          config push and the DevDogs sign-in provider. A plan
#                          that drops or rewrites data is refused unless its
#                          pull request approved it (allow-destructive).
#     production-copy      the legacyUserId copy of the old DogDays data
#                          (legacy-copy.sh), when DOGDAYS_LEGACY_COPY is `true`.
#                          It runs once; the ledger in the database keeps a
#                          second run from copying anything twice.
#
#   the Worker   `staging-worker` and `production-worker` call DevDogsUGA's shared
#                deploy-worker.yaml (upload a version, preview it at 0%, smoke test it,
#                switch, smoke test what is live, roll back on failure). Each is OFF
#                until its repository variable is `true`: DOGDAYS_WORKER_DEPLOY for
#                staging, DOGDAYS_DEPLOYS_PRODUCTION for production (the same latch as
#                the database). The first deploy of a Worker has no live version to
#                preview beside, so it runs with DOGDAYS_WORKER_MODE=full; unset the
#                variable afterwards. Both environments need a CLOUDFLARE_API_TOKEN
#                secret (and, for source maps, SENTRY_AUTH_TOKEN).
#
# ONE APPROVAL (opt-in). With the repository variable ONE_APPROVAL set to `true`,
# production asks for approval once: `production-plan` reads the database,
# `production-approval` is the single pause (the reviewed `production-approval`
# environment), and the database apply, the legacy copy and the Worker all run
# in `production` after it, which then has no reviewers. Unset, every job asks as
# before. DevDogsUGA's docs/operations/deploys/one-approval.md has the switch.
#
# Every approved production job refuses an approver who wrote or queued the
# change, and a candidate that is no longer the head of main.
on:
  workflow_call:
    inputs:
      config:
        description: Push supabase/config.toml and register the DevDogs sign-in provider.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      config:
        description: Push supabase/config.toml and register the DevDogs sign-in provider (the first deploy of an environment, or after the OAuth client changed).
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

env:
  # One commit of DevDogsUGA for the shared blocks AND their scripts. Bump
  # both lines below (and database.yaml, destructive-gate.yaml) together.
  SHARED_REF: 558f467668e707ef529940f30226300b9cf56305

jobs:
  # Does this deploy push the Supabase configuration? On a push, only when
  # supabase/config.toml changed since production last applied (every push asking for an approval just to find
  # nothing changed would teach reviewers to click through).
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config: ${{ steps.config.outputs.config }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: DevDogsUGA/DevDogsUGA
          ref: ${{ env.SHARED_REF }}
          path: .shared
          sparse-checkout: .github/scripts
      # Compared with the commit production LAST APPLIED, not the previous
      # commit: a config change in a candidate that was superseded or cancelled
      # stays pending until a deploy applies it (config-changed.mjs).
      - name: Is the Supabase configuration part of this deploy?
        id: config
        env:
          REQUESTED: ${{ inputs.config }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=false
          if [ "$REQUESTED" = true ]; then
            config=true
          else
            config=$(node .shared/.github/scripts/config-changed.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" | sed -n 's/^config=//p')
          fi
          echo "config=${config:-true}" >> "$GITHUB_OUTPUT"
          echo "Supabase configuration in this deploy: ${config:-true}" >> "$GITHUB_STEP_SUMMARY"

  staging-database:
    needs: resolve
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/deploy-database.yaml@558f467668e707ef529940f30226300b9cf56305
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: staging
      apply_config: ${{ needs.resolve.outputs.config == 'true' }}
      # Staging holds no Supabase Management API token (an account-wide
      # credential must not sit in an environment without reviewers), so CI
      # cannot enable or register the sign-in provider there. It was registered
      # once by an owner with the shared config-push.mjs (workflow-1/4a-step2.md),
      # and a rolled client secret is registered the same way.
      register_provider: false
      supabase_version: 2.117.0
      shared_ref: 558f467668e707ef529940f30226300b9cf56305

  # What was deployed is what the schema says, and the API is safe to put in
  # front of students: it serves the dogdays schema, a signed-out request gets
  # nothing, and the claim function is not callable without a session.
  staging-verify:
    needs: staging-database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The API serves the schema and refuses a signed-out visitor
        env:
          API_URL: ${{ vars.API_URL }}
          PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
        run: bash .github/scripts/verify-deploy.sh

  production-catalog:
    needs: [resolve, staging-verify]
    if: >-
      !cancelled()
      && vars.DOGDAYS_DEPLOYS_PRODUCTION == 'true'
      && needs.staging-verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Wait for the production catalog to serve the current and the next term
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL || 'https://api.devdogsuga.org/catalog/v1' }}
          WAIT_MINUTES: 120
        run: node .github/scripts/wait-for-catalog.mjs

  production-database:
    needs: [resolve, production-catalog]
    if: >-
      !cancelled()
      && vars.DOGDAYS_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL != 'true'
      && needs.production-catalog.result == 'success'
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/deploy-database.yaml@558f467668e707ef529940f30226300b9cf56305
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: production
      plan_environment: preflight
      require_read_only_planner: true
      # The first production deploy always pushes the configuration and registers
      # the provider (email sign-up off, only `dogdays` served, DevDogs sign-in),
      # whatever the run's inputs say: until the repository variable
      # DOGDAYS_PRODUCTION_CONFIGURED is `true`. Set it after that run succeeds;
      # from then on a config push follows a config.toml change or the input.
      apply_config: ${{ needs.resolve.outputs.config == 'true' || vars.DOGDAYS_PRODUCTION_CONFIGURED != 'true' }}
      register_provider: ${{ needs.resolve.outputs.config == 'true' || vars.DOGDAYS_PRODUCTION_CONFIGURED != 'true' }}
      self_approval_gate: true
      require_latest: true
      supabase_version: 2.117.0
      shared_ref: 558f467668e707ef529940f30226300b9cf56305

  # --- the one-approval flow (ONE_APPROVAL=true) ---
  production-plan:
    needs: [resolve, production-catalog]
    if: >-
      !cancelled()
      && vars.DOGDAYS_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL == 'true'
      && needs.production-catalog.result == 'success'
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/plan-database.yaml@558f467668e707ef529940f30226300b9cf56305
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: production
      plan_environment: preflight
      supabase_version: 2.117.0
      shared_ref: 558f467668e707ef529940f30226300b9cf56305

  production-approval:
    needs: [resolve, production-plan]
    if: >-
      !cancelled()
      && vars.ONE_APPROVAL == 'true'
      && needs.production-plan.result == 'success'
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/approve-production.yaml@558f467668e707ef529940f30226300b9cf56305
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      approval_environment: production-approval
      plan_environment_name: production
      shared_ref: 558f467668e707ef529940f30226300b9cf56305
      notes: |
        - Supabase configuration push and sign-in provider registration: ${{ (needs.resolve.outputs.config == 'true' || vars.DOGDAYS_PRODUCTION_CONFIGURED != 'true') && 'yes' || 'skipped (config.toml did not change)' }}
        - Legacy data copy: ${{ vars.DOGDAYS_LEGACY_COPY == 'true' && 'yes (dry run, then for real)' || 'no' }}
        - Worker `production-dogdays`: deploys (upload, preview smoke test, switch traffic, live smoke test)
        - Order: schema and configuration, the verify, the legacy copy, then the Worker.

  production-database-apply:
    needs: [resolve, production-plan, production-approval]
    if: >-
      !cancelled()
      && vars.ONE_APPROVAL == 'true'
      && needs.production-approval.result == 'success'
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/apply-database.yaml@558f467668e707ef529940f30226300b9cf56305
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: production
      approval_environment: production-approval
      pending: ${{ needs.production-plan.outputs.pending }}
      migrations_hash: ${{ needs.production-plan.outputs.migrations_hash }}
      schema_hash: ${{ needs.production-plan.outputs.schema_hash }}
      schema_empty: ${{ needs.production-plan.outputs.schema_empty }}
      apply_config: ${{ needs.resolve.outputs.config == 'true' || vars.DOGDAYS_PRODUCTION_CONFIGURED != 'true' }}
      register_provider: ${{ needs.resolve.outputs.config == 'true' || vars.DOGDAYS_PRODUCTION_CONFIGURED != 'true' }}
      supabase_version: 2.117.0
      shared_ref: 558f467668e707ef529940f30226300b9cf56305

  # The same checks as staging, against the production API, after the schema and
  # configuration are in. Catches a first deploy that left Supabase's defaults
  # (public served, no provider) behind.
  production-verify:
    needs: [production-database, production-database-apply]
    if: >-
      !cancelled()
      && vars.DOGDAYS_DEPLOYS_PRODUCTION == 'true'
      && (needs.production-database.result == 'success' || needs.production-database-apply.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only and public: no approval, and only the two public values and the site URL.
    environment: production-verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The API serves the schema and refuses a signed-out visitor
        env:
          API_URL: ${{ vars.API_URL }}
          PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
        run: bash .github/scripts/verify-deploy.sh
      - name: DevDogs sign-in is registered, and sign-up by email is off
        env:
          API_URL: ${{ vars.API_URL }}
          PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          set -euo pipefail
          settings=$(curl -fsS "$API_URL/auth/v1/settings" -H "apikey: $PUBLISHABLE_KEY")
          echo "$settings" | jq -e '.external.email == false and .external.phone == false' >/dev/null \
            || { echo "::error::Email or phone sign-up is still on: the configuration was not pushed."; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$API_URL/auth/v1/authorize?provider=custom:devdogsuga&redirect_to=$BASE_URL")
          [ "$code" = 302 ] || { echo "::error::custom:devdogsuga answered $code, not a redirect: the provider is not registered."; exit 1; }

  # The one-time copy of the old DogDays data. PLATFORM_DB_URL is a login on the
  # PLATFORM database that can read the four user tables and nothing else
  # (platform-copy-role.sql); it lives in the `production` environment, so only
  # an approved job on main can read it. Dry run first: the counts are in the
  # summary before anything is written.
  production-copy:
    needs: [production-database, production-database-apply]
    if: >-
      !cancelled()
      && vars.DOGDAYS_DEPLOYS_PRODUCTION == 'true'
      && vars.DOGDAYS_LEGACY_COPY == 'true'
      && (needs.production-database.result == 'success' || needs.production-database-apply.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: DevDogsUGA/DevDogsUGA
          ref: ${{ env.SHARED_REF }}
          path: .shared
          sparse-checkout: .github/scripts
      - name: Refuse an approver who wrote or queued this change
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .shared/.github/scripts/approval-gate.mjs
          --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
          --environment "${{ vars.ONE_APPROVAL == 'true' && 'production-approval' || 'production' }}"
      - name: Refuse an approved candidate that is no longer the head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          latest=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Candidate $GITHUB_SHA was superseded by $latest. Nothing was changed; the newer commit has its own run."
            exit 1
          fi
      - name: Copy the old DogDays data (dry run, then for real)
        env:
          SRC_URL: ${{ secrets.PLATFORM_DB_URL }}
          DST_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SRC_URL" ]; then
            echo "::error::The production environment has no PLATFORM_DB_URL secret (see .github/scripts/platform-copy-role.sql)."
            exit 1
          fi
          bash .github/scripts/legacy-copy.sh --dry-run
          bash .github/scripts/legacy-copy.sh

  # The Worker. The browser values are baked into the build, so the build is the
  # shared workflow's `prepare_command` (the only step that reads the
  # environment's variables), and wrangler uploads the result.
  staging-worker:
    needs: staging-verify
    if: >-
      !cancelled()
      && vars.DOGDAYS_WORKER_DEPLOY == 'true'
      && needs.staging-verify.result == 'success'
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/deploy-worker.yaml@558f467668e707ef529940f30226300b9cf56305
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: staging
      tier: staging
      use_wrangler_env: false
      worker_dir: .
      worker_name: staging-dogdays
      smoke_path: dogdays
      workers_json: workers.json
      mode: ${{ vars.DOGDAYS_WORKER_MODE || 'versions' }}
      sentry_project: schedule-builder
      sourcemaps_dir: dist
      setup_workspace: false
      setup_command: bash .github/scripts/worker-setup.sh
      prepare_command: bash .github/scripts/worker-build.sh
      upload_command: pnpm exec wrangler versions upload --message "$RELEASE" --var "SENTRY_RELEASE:$RELEASE" --var "SENTRY_DSN:$SENTRY_DSN"
      full_deploy_command: pnpm exec wrangler deploy --message "$RELEASE" --var "SENTRY_RELEASE:$RELEASE" --var "SENTRY_DSN:$SENTRY_DSN"
      shared_ref: 558f467668e707ef529940f30226300b9cf56305

  production-worker:
    needs:
      [
        production-database,
        production-database-apply,
        production-verify,
        production-copy,
      ]
    if: >-
      !cancelled()
      && vars.DOGDAYS_DEPLOYS_PRODUCTION == 'true'
      && needs.production-verify.result == 'success'
      && (needs.production-copy.result == 'success' || needs.production-copy.result == 'skipped')
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/deploy-worker.yaml@558f467668e707ef529940f30226300b9cf56305
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: production
      tier: production
      use_wrangler_env: false
      worker_dir: .
      worker_name: production-dogdays
      approval_environment: ${{ vars.ONE_APPROVAL == 'true' && 'production-approval' || '' }}
      smoke_path: dogdays
      workers_json: workers.json
      mode: ${{ vars.DOGDAYS_WORKER_MODE || 'versions' }}
      sentry_project: schedule-builder
      sourcemaps_dir: dist
      setup_workspace: false
      setup_command: bash .github/scripts/worker-setup.sh
      prepare_command: bash .github/scripts/worker-build.sh
      upload_command: pnpm exec wrangler versions upload --message "$RELEASE" --var "SENTRY_RELEASE:$RELEASE" --var "SENTRY_DSN:$SENTRY_DSN"
      full_deploy_command: pnpm exec wrangler deploy --message "$RELEASE" --var "SENTRY_RELEASE:$RELEASE" --var "SENTRY_DSN:$SENTRY_DSN"
      self_approval_gate: true
      require_latest: true
      shared_ref: 558f467668e707ef529940f30226300b9cf56305

name: Destructive gate

# Who applied the allow-destructive label. Runs on pull_request_target so its
# token can remove a label a non-DevOps user applied, which means it must NEVER
# check out or run the pull request's code: the shared workflow takes its
# script from the base branch and the pinned DevDogsUGA commit and reads nothing
# but the pull request number. Do not add steps to this file.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  destructive-gate:
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/destructive-gate.yaml@93c668bfb408edd2d48f442da2a46b36594da1cf
    with:
      shared_ref: 93c668bfb408edd2d48f442da2a46b36594da1cf

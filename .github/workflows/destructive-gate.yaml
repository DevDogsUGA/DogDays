name: Destructive gate

# Who applied the allow-destructive label. Runs on pull_request_target so its
# token can remove a label a non-DevOps user applied, which means it must NEVER
# check out or run the pull request's code: the shared workflow takes its
# script from the base branch and the pinned DevDogsUGA commit and reads nothing
# but the pull request number. Do not add steps to this file.
#
# The job is `destructive-label`, not `destructive-gate`: the required
# `destructive-gate / destructive-gate` comes from database.yaml alone, and a
# second result under that name on the same commit could satisfy the ruleset
# in its place.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  destructive-label:
    uses: DevDogsUGA/DevDogsUGA/.github/workflows/destructive-gate.yaml@9ec22463ce5f5a6be864a4ee957522daac5f8e3c
    with:
      shared_ref: 9ec22463ce5f5a6be864a4ee957522daac5f8e3c
